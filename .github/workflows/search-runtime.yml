name: Current source search and Android check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Hebrew and English keyword matching
        run: |
          mkdir -p build/search-tests
          javac -encoding UTF-8 -d build/search-tests app/src/main/java/com/coolet/app/MediaSearch.java tools/MediaSearchTest.java
          java -cp build/search-tests com.coolet.app.MediaSearchTest
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint current source
        run: gradle lintDebug assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise current build, import, search and persistence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: COOLET_TEST_APK=app/build/outputs/apk/debug/app-debug.apk python3 tools/preview_smoke.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-search-evidence
          path: |
            runtime-evidence/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

